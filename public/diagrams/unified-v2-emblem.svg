<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Version 2: The Sovereign Emblem">
  <defs>
    <radialGradient id="v2-gold-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF0A8"/>
      <stop offset="60%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#B48A05"/>
    </radialGradient>
    <linearGradient id="v2-charcoal-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142840"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#142840"/>
    </linearGradient>
    <linearGradient id="v2-orange-flash" x1="0%" y1="0%" x2="100%" y2="100%">
