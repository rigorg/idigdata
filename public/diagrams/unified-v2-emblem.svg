      <g transform="translate(0, 450)"><circle cx="0" cy="0" r="38" fill="#FBF9F4" stroke="#142840" stroke-width="3"/><circle cx="0" cy="0" r="24" fill="#FACC15" fill-opacity="0.4" stroke="#142840" stroke-width="1.8"/><circle cx="0" cy="0" r="10" fill="#142840"/></g>
      <g transform="translate(-172.2, 415.7)"><circle cx="0" cy="0" r="38" fill="#FBF9F4" stroke="#142840" stroke-width="3"/><circle cx="0" cy="0" r="24" fill="#FACC15" fill-opacity="0.4" stroke="#142840" stroke-width="1.8"/><circle cx="0" cy="0" r="10" fill="#142840"/></g>
      <g transform="translate(-318.2, 318.2)"><circle cx="0" cy="0" r="38" fill="#FBF9F4" stroke="#142840" stroke-width="3"/><circle cx="0" cy="0" r="24" fill="#FACC15" fill-opacity="0.4" stroke="#142840" stroke-width="1.8"/><circle cx="0" cy="0" r="10" fill="#142840"/></g>
