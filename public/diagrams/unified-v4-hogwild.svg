      <polygon points="0,-34 29.4,-17 29.4,17 0,34 -29.4,17 -29.4,-17" transform="translate(102, -176.6)" fill="#FBF9F4"/>
      <polygon points="0,-34 29.4,-17 29.4,17 0,34 -29.4,17 -29.4,-17" transform="translate(153, -88.3)" fill="#FDE68A" fill-opacity="0.5"/>
      <polygon points="0,-34 29.4,-17 29.4,17 0,34 -29.4,17 -29.4,-17" transform="translate(204, 0)" fill="#FACC15" fill-opacity="0.6"/>
      <polygon points="0,-34 29.4,-17 29.4,17 0,34 -29.4,17 -29.4,-17" transform="translate(153, 88.3)" fill="#FDE68A" fill-opacity="0.5"/>
      <polygon points="0,-34 29.4,-17 29.4,17 0,34 -29.4,17 -29.4,-17" transform="translate(102, 176.6)" fill="#FBF9F4"/>
      <polygon points="0,-34 29.4,-17 29.4,17 0,34 -29.4,17 -29.4,-17" transform="translate(0, 176.6)" fill="#FACC15" fill-opacity="0.6"/>
      <polygon points="0,-34 29.4,-17 29.4,17 0,34 -29.4,17 -29.4,-17" transform="translate(-102, 176.6)" fill="#FBF9F4"/>
