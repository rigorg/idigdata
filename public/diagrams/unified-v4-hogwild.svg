<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Version 4: The Full-Power Apex Engine (Hog-Ass Wild)">
  <defs>
    <!-- Multi-layered Gradients -->
    <radialGradient id="v4-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF5C2"/>
      <stop offset="40%" stop-color="#FACC15"/>
      <stop offset="85%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </radialGradient>

    <linearGradient id="v4-sweep-p2m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142840"/>
      <stop offset="25%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#C2410C"/>
      <stop offset="75%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#142840"/>
    </linearGradient>

    <linearGradient id="v4-sweep-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142840"/>
      <stop offset="30%" stop-color="#FACC15"/>
      <stop offset="70%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#142840"/>
    </linearGradient>

    <pattern id="v4-mesh" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#FBF9F4"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#142840" stroke-width="0.9" stroke-opacity="0.25"/>
      <line x1="0" y1="0" x2="12" y2="0" stroke="#FACC15" stroke-width="0.9" stroke-opacity="0.55"/>
      <circle cx="6" cy="6" r="1" fill="#D97706" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1000" height="1000" fill="#FBF9F4"/>

  <g transform="translate(500, 500)">
