    <circle cx="0" cy="0" r="120" fill="none" stroke="#142840" stroke-width="3" opacity="0.65"/>

    <!-- 2. Dynamic 16-Point & 6-Point Sacred Star Geometry Web -->
    <g stroke="#142840" stroke-width="1.2" opacity="0.35">
