    <circle cx="0" cy="0" r="470" fill="none" stroke="#142840" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="455" fill="none" stroke="#FACC15" stroke-width="2"/>
    <circle cx="0" cy="0" r="330" fill="none" stroke="url(#v4-mesh)" stroke-width="250"/>
    <circle cx="0" cy="0" r="415" fill="none" stroke="#142840" stroke-width="1.8" stroke-dasharray="10,6" opacity="0.45"/>
