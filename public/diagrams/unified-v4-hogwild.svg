      <polygon points="0,-450 172.2,-415.7 318.2,-318.2 415.7,-172.2 450,0 415.7,172.2 318.2,318.2 172.2,415.7 0,450 -172.2,415.7 -318.2,318.2 -415.7,172.2 -450,0 -415.7,-172.2 -318.2,-318.2 -172.2,-415.7" fill="none" stroke="#FACC15" stroke-width="1.8" opacity="0.6"/>
