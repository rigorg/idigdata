<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Version 2: The High-Contrast Brand Triad">
  <defs>
    <clipPath id="v2-hex-clip">
      <polygon points="0,-270 233.8,-135 233.8,135 0,270 -233.8,135 -233.8,-135"/>
    </clipPath>
    <mask id="v2-core-mask">
      <rect x="-500" y="-500" width="1000" height="1000" fill="white"/>
      <circle cx="0" cy="0" r="54" fill="black"/>
    </mask>

    <pattern id="v2-honeycomb" patternUnits="userSpaceOnUse" width="36" height="62.35">
      <path d="M 0,0 L 18,10.39 L 18,31.18 L 0,41.57 L -18,31.18 L -18,10.39 Z
               M 36,0 L 54,10.39 L 54,31.18 L 36,41.57 L 18,31.18 L 18,10.39 Z
               M 0,62.35 L 18,72.74 L 18,93.53 L 0,103.92 L -18,93.53 L -18,72.74 Z
               M 36,62.35 L 54,72.74 L 54,93.53 L 36,103.92 L 18,93.53 L 18,72.74 Z
               M 18,31.18 L 36,41.57 L 36,62.35 L 18,72.74 L 0,62.35 L 0,41.57 Z"
            fill="none" stroke="#142840" stroke-width="1.4" stroke-opacity="0.8"/>
    </pattern>

    <linearGradient id="v2-p2m-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142840"/>
      <stop offset="40%" stop-color="#FACC15"/>
      <stop offset="75%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#142840"/>
    </linearGradient>
    <linearGradient id="v2-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142840"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#142840"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1000" fill="#FBF9F4"/>

  <g transform="translate(500, 500)">
    <!-- 1. Outer Tracks -->
    <circle cx="0" cy="0" r="445" fill="none" stroke="#142840" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="415" fill="none" stroke="#142840" stroke-width="1.8" stroke-opacity="0.6"/>
    <circle cx="0" cy="0" r="335" fill="none" stroke="#FACC15" stroke-width="1.8" stroke-opacity="0.8"/>

    <!-- 2. 16 Thin Radial Spokes (1.2px) -->
    <g stroke="#142840" stroke-width="1.3" stroke-opacity="0.5">
      <line x1="0" y1="0" x2="0" y2="-445"/>
      <line x1="0" y1="0" x2="170.3" y2="-411.1"/>
      <line x1="0" y1="0" x2="314.7" y2="-314.7"/>
      <line x1="0" y1="0" x2="411.1" y2="-170.3"/>
      <line x1="0" y1="0" x2="445" y2="0"/>
      <line x1="0" y1="0" x2="411.1" y2="170.3"/>
      <line x1="0" y1="0" x2="314.7" y2="314.7"/>
      <line x1="0" y1="0" x2="170.3" y2="411.1"/>
      <line x1="0" y1="0" x2="0" y2="445"/>
      <line x1="0" y1="0" x2="-170.3" y2="411.1"/>
      <line x1="0" y1="0" x2="-314.7" y2="314.7"/>
      <line x1="0" y1="0" x2="-411.1" y2="170.3"/>
      <line x1="0" y1="0" x2="-445" y2="0"/>
      <line x1="0" y1="0" x2="-411.1" y2="-170.3"/>
      <line x1="0" y1="0" x2="-314.7" y2="-314.7"/>
      <line x1="0" y1="0" x2="-170.3" y2="-411.1"/>
    </g>

    <!-- 3. Complete Seamless Honeycomb Infill -->
    <rect x="-300" y="-300" width="600" height="600"
          fill="url(#v2-honeycomb)"
          clip-path="url(#v2-hex-clip)"
          mask="url(#v2-core-mask)"/>

    <!-- 4. Major Constellation Hexagon Perimeter & 6 Core Spokes -->
    <polygon points="0,-270 233.8,-135 233.8,135 0,270 -233.8,135 -233.8,-135" fill="none" stroke="#142840" stroke-width="5"/>
    <polygon points="0,-280 242.5,-140 242.5,140 0,280 -242.5,140 -242.5,-140" fill="none" stroke="#FACC15" stroke-width="1.8"/>

    <g stroke="#142840" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-270"/>
      <line x1="0" y1="0" x2="233.8" y2="-135"/>
      <line x1="0" y1="0" x2="233.8" y2="135"/>
      <line x1="0" y1="0" x2="0" y2="270"/>
      <line x1="0" y1="0" x2="-233.8" y2="135"/>
      <line x1="0" y1="0" x2="-233.8" y2="-135"/>
    </g>

    <!-- 5. Six Large Constellation Hubs (r=50) -->
    <!-- 12h: P2P -->
    <g transform="translate(0, -270)">
      <circle cx="0" cy="0" r="54" fill="none" stroke="url(#v2-gold-grad)" stroke-width="8"/>
      <circle cx="0" cy="0" r="46" fill="#FBF9F4" stroke="#142840" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="28" fill="#FACC15" stroke="#142840" stroke-width="2"/>
    </g>
    <!-- 2h: O2C -->
    <g transform="translate(233.8, -135)">
      <circle cx="0" cy="0" r="54" fill="none" stroke="url(#v2-gold-grad)" stroke-width="8"/>
      <circle cx="0" cy="0" r="46" fill="#FBF9F4" stroke="#142840" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="28" fill="#FACC15" stroke="#142840" stroke-width="2"/>
    </g>
    <!-- 4h: P2M (Criticality Core) -->
    <g transform="translate(233.8, 135)">
      <circle cx="0" cy="0" r="54" fill="none" stroke="url(#v2-p2m-grad)" stroke-width="10"/>
      <circle cx="0" cy="0" r="46" fill="#FBF9F4" stroke="#142840" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="28" fill="#C2410C" stroke="#142840" stroke-width="2"/>
    </g>
    <!-- 6h: S2S -->
    <g transform="translate(0, 270)">
      <circle cx="0" cy="0" r="54" fill="none" stroke="url(#v2-gold-grad)" stroke-width="8"/>
      <circle cx="0" cy="0" r="46" fill="#FBF9F4" stroke="#142840" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="28" fill="#FDE68A" stroke="#142840" stroke-width="2"/>
    </g>
    <!-- 8h: D2R -->
    <g transform="translate(-233.8, 135)">
      <circle cx="0" cy="0" r="54" fill="none" stroke="url(#v2-gold-grad)" stroke-width="8"/>
      <circle cx="0" cy="0" r="46" fill="#FBF9F4" stroke="#142840" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="28" fill="#FACC15" stroke="#142840" stroke-width="2"/>
    </g>
    <!-- 10h: MDM -->
    <g transform="translate(-233.8, -135)">
      <circle cx="0" cy="0" r="54" fill="none" stroke="url(#v2-gold-grad)" stroke-width="8"/>
      <circle cx="0" cy="0" r="46" fill="#FBF9F4" stroke="#142840" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="28" fill="#FACC15" stroke="#142840" stroke-width="2"/>
    </g>

    <!-- 6. Central Sun-Gold Data Core -->
    <circle cx="0" cy="0" r="56" fill="#FACC15" stroke="#142840" stroke-width="4"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#142840" stroke-width="1.8" stroke-dasharray="3,3"/>
    <circle cx="0" cy="0" r="24" fill="#FBF9F4" stroke="#142840" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#142840"/>

    <!-- 7. 16 System Bubbles (r=26) -->
    <g>
      <g transform="translate(0, -415)"><circle cx="0" cy="0" r="26" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="#FACC15" fill-opacity="0.4" stroke="#142840" stroke-width="1.2"/></g>
      <g transform="translate(158.8, -383.4)"><circle cx="0" cy="0" r="26" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="#FACC15" fill-opacity="0.4" stroke="#142840" stroke-width="1.2"/></g>
      <g transform="translate(293.4, -293.4)"><circle cx="0" cy="0" r="26" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="#FACC15" fill-opacity="0.4" stroke="#142840" stroke-width="1.2"/></g>
      <g transform="translate(383.4, -158.8)"><circle cx="0" cy="0" r="26" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="#FACC15" fill-opacity="0.4" stroke="#142840" stroke-width="1.2"/></g>
      <g transform="translate(415, 0)"><circle cx="0" cy="0" r="26" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="#FACC15" fill-opacity="0.4" stroke="#142840" stroke-width="1.2"/></g>
      <g transform="translate(383.4, 158.8)"><circle cx="0" cy="0" r="26" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="#FACC15" fill-opacity="0.4" stroke="#142840" stroke-width="1.2"/></g>
      <g transform="translate(293.4, 293.4)"><circle cx="0" cy="0" r="26" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="#FACC15" fill-opacity="0.4" stroke="#142840" stroke-width="1.2"/></g>
      <g transform="translate(158.8, 383.4)"><circle cx="0" cy="0" r="26" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="#FACC15" fill-opacity="0.4" stroke="#142840" stroke-width="1.2"/></g>
      <g transform="translate(0, 415)"><circle cx="0" cy="0" r="26" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="#FACC15" fill-opacity="0.4" stroke="#142840" stroke-width="1.2"/></g>
      <g transform="translate(-158.8, 383.4)"><circle cx="0" cy="0" r="26" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="#FACC15" fill-opacity="0.4" stroke="#142840" stroke-width="1.2"/></g>
      <g transform="translate(-293.4, 293.4)"><circle cx="0" cy="0" r="26" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="#FACC15" fill-opacity="0.4" stroke="#142840" stroke-width="1.2"/></g>
      <g transform="translate(-383.4, 158.8)"><circle cx="0" cy="0" r="26" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="#FACC15" fill-opacity="0.4" stroke="#142840" stroke-width="1.2"/></g>
      <g transform="translate(-415, 0)"><circle cx="0" cy="0" r="26" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="#FACC15" fill-opacity="0.4" stroke="#142840" stroke-width="1.2"/></g>
      <g transform="translate(-383.4, -158.8)"><circle cx="0" cy="0" r="26" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="#FACC15" fill-opacity="0.4" stroke="#142840" stroke-width="1.2"/></g>
      <g transform="translate(-293.4, -293.4)"><circle cx="0" cy="0" r="26" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="#FACC15" fill-opacity="0.4" stroke="#142840" stroke-width="1.2"/></g>
      <g transform="translate(-158.8, -383.4)"><circle cx="0" cy="0" r="26" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="#FACC15" fill-opacity="0.4" stroke="#142840" stroke-width="1.2"/></g>
    </g>
  </g>
</svg>
