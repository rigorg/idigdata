<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 540 530" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="beehive-title beehive-desc">
  <title id="beehive-title">AV-04 · The Beehive · brand-v2 · author-v2 · 2026-05-09</title>
  <desc id="beehive-desc">Hexagonal honeycomb of 13 functional system groups arranged 3-2-3-2-3 (PLM, Sales, Compliance / Production MES, Supply Chain / EAM, MDM at center, WMS / HRIS, ERP / IT, Finance/Accounting, Sustainability). Six business process flows (P2P, O2C, P2M, S2S, D2R, MDM) feed in from the left, crossing the functional groups. Standard frame everywhere; bespoke fill — 100s of BPSc per BPF, unique per operator. Same six BPFs as the constellation spine; same atom (PEGS) appears in both diagrams with different coordinates. Brand v2 chrome: charcoal structure, sun-gold MDM/CDM center, cream substrate, Helvetica Black approximation title, Georgia italic captions.</desc>

  <!-- Arrow marker + fabric pattern definitions -->
  <defs>
    <marker id="bpf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F2937" fill-opacity="0.55"/>
    </marker>
    <pattern id="fabric-mesh" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#FBF9F4"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#7A756A" stroke-width="0.5" stroke-opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Background · cream substrate (brand v2) -->
  <rect width="540" height="700" fill="#FBF9F4"/>

  <!-- Title block · heavy geometric sans (Helvetica Black approximation) + Georgia italic subtitle -->
  <text x="270" y="48" text-anchor="middle" font-weight="900" font-size="28" fill="#1F2937" letter-spacing="-0.3" font-family="'Helvetica Neue', 'Arial Black', Impact, system-ui, sans-serif">THE BEEHIVE</text>
  <text x="270" y="72" text-anchor="middle" font-style="italic" font-size="13" fill="#6B6860" font-family="Georgia, 'Times New Roman', serif">Process flows × functional groups · universal frame</text>

  <!-- BPF column header -->
  <text x="70" y="115" text-anchor="middle" font-style="italic" font-size="10" fill="#6B6860" letter-spacing="2" font-family="Georgia, 'Times New Roman', serif">BPF</text>

  <!-- BPF circles (left column, vertically stacked, feeding hex grid via arrows) -->
  <g>
    <circle cx="70" cy="165" r="22" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.5"/>
    <text x="70" y="170" text-anchor="middle" font-weight="bold" font-size="12" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">P2P</text>
    <line x1="92" y1="165" x2="198" y2="165" stroke="#1F2937" stroke-width="1.5" stroke-opacity="0.4" marker-end="url(#bpf-arrow)"/>

    <circle cx="70" cy="220" r="22" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.5"/>
    <text x="70" y="225" text-anchor="middle" font-weight="bold" font-size="12" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">O2C</text>
    <line x1="92" y1="220" x2="198" y2="220" stroke="#1F2937" stroke-width="1.5" stroke-opacity="0.4" marker-end="url(#bpf-arrow)"/>

    <circle cx="70" cy="275" r="22" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.5"/>
    <text x="70" y="280" text-anchor="middle" font-weight="bold" font-size="12" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">P2M</text>
    <line x1="92" y1="275" x2="198" y2="275" stroke="#1F2937" stroke-width="1.5" stroke-opacity="0.4" marker-end="url(#bpf-arrow)"/>

    <circle cx="70" cy="335" r="22" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.5"/>
    <text x="70" y="340" text-anchor="middle" font-weight="bold" font-size="12" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">S2S</text>
    <line x1="92" y1="335" x2="198" y2="335" stroke="#1F2937" stroke-width="1.5" stroke-opacity="0.4" marker-end="url(#bpf-arrow)"/>

    <circle cx="70" cy="390" r="22" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.5"/>
    <text x="70" y="395" text-anchor="middle" font-weight="bold" font-size="12" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">D2R</text>
    <line x1="92" y1="390" x2="198" y2="390" stroke="#1F2937" stroke-width="1.5" stroke-opacity="0.4" marker-end="url(#bpf-arrow)"/>

    <circle cx="70" cy="445" r="22" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.5"/>
    <text x="70" y="450" text-anchor="middle" font-weight="bold" font-size="12" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">MDM</text>
    <line x1="92" y1="445" x2="198" y2="445" stroke="#1F2937" stroke-width="1.5" stroke-opacity="0.4" marker-end="url(#bpf-arrow)"/>
  </g>

  <!-- Functional groups header (above hex grid) -->
  <text x="320" y="115" text-anchor="middle" font-style="italic" font-size="10" fill="#6B6860" letter-spacing="2" font-family="Georgia, 'Times New Roman', serif">FUNCTIONAL GROUPS</text>

  <!-- Beehive fabric box (the operating fabric — BPFs connect to this; fabric routes internally to cells) -->
  <rect x="200" y="125" width="240" height="345" rx="14" fill="url(#fabric-mesh)" stroke="#1F2937" stroke-width="1.2" stroke-opacity="0.45"/>

  <!-- Hex grid: 3-2-3-2-3 honeycomb, vertical layout. Pointy-top, r=40 -->
  <!-- Row 1: y=170 (3 cells) -->
  <g transform="translate(250.8, 170)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">PLM</text></g>
  <g transform="translate(320, 170)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">Sales</text></g>
  <g transform="translate(389.2, 170)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">Compliance</text></g>

  <!-- Row 2: y=230 (2 cells, offset) -->
  <g transform="translate(285.4, 230)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.5"/><text x="0" y="-2" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">Production</text><text x="0" y="11" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">MES</text></g>
  <g transform="translate(354.6, 230)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.5"/><text x="0" y="-2" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">Supply</text><text x="0" y="11" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">Chain</text></g>

  <!-- Row 3: y=290 (3 cells, MDM+CDM at center · sun-gold fill matches AV-02/AV-03 data core treatment) -->
  <g transform="translate(250.8, 290)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">EAM</text></g>
  <g transform="translate(320, 290)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FACC15" stroke="#1F2937" stroke-width="2"/><text x="0" y="-3" text-anchor="middle" font-size="13" font-weight="900" fill="#1F2937" font-family="'Helvetica Neue', 'Arial Black', Impact, system-ui, sans-serif">MDM</text><text x="0" y="13" text-anchor="middle" font-size="9" font-style="italic" fill="#1F2937" font-family="Georgia, 'Times New Roman', serif">+ CDM</text></g>
  <g transform="translate(389.2, 290)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">WMS</text></g>

  <!-- Row 4: y=350 (2 cells, offset) -->
  <g transform="translate(285.4, 350)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">HRIS</text></g>
  <g transform="translate(354.6, 350)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">ERP</text></g>

  <!-- Row 5: y=410 (3 cells) -->
  <g transform="translate(250.8, 410)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">IT</text></g>
  <g transform="translate(320, 410)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.5"/><text x="0" y="-2" text-anchor="middle" font-size="9" font-weight="bold" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">Finance/</text><text x="0" y="11" text-anchor="middle" font-size="9" font-weight="bold" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">Accounting</text></g>
  <g transform="translate(389.2, 410)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">Sustainability</text></g>

  <!-- Mid-rule callout -->
  <text x="270" y="500" text-anchor="middle" font-style="italic" font-size="11" fill="#6B6860" letter-spacing="2" font-family="Georgia, 'Times New Roman', serif">flows × groups · BPSc lives at every intersection</text>

  <!-- Stone rule + footer caption -->
  <line x1="80" y1="640" x2="460" y2="640" stroke="#7A756A" stroke-width="0.8"/>
  <text x="270" y="660" text-anchor="middle" font-style="italic" font-size="12" fill="#6B6860" font-family="Georgia, 'Times New Roman', serif">Standard frame · bespoke fill · 100s of BPSc per BPF, unique per operator</text>
</svg>
