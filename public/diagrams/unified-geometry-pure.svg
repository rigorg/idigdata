      <line x1="73.6" y1="-42.5" x2="207.8" y2="-120"/>
      <line x1="73.6" y1="42.5" x2="207.8" y2="120"/>
      <line x1="0" y1="85" x2="0" y2="240"/>
      <line x1="-73.6" y1="42.5" x2="-207.8" y2="120"/>
      <line x1="-73.6" y1="-42.5" x2="-207.8" y2="-120"/>
    </g>

    <!-- 5. Six Process Constellation Hubs (R=300, radius r=58) -->
