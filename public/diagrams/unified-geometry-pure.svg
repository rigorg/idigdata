    <line x1="85" y1="0" x2="72" y2="0" stroke="#1F2937" stroke-width="2.5"/>
    <line x1="0" y1="85" x2="0" y2="72" stroke="#1F2937" stroke-width="2.5"/>
    <line x1="-85" y1="0" x2="-72" y2="0" stroke="#1F2937" stroke-width="2.5"/>

    <!-- 7. Outer Systemverse Orbit: 16 Large, Substantial System Nodes (R=425, radius r=34) -->
    <g id="systemverse-nodes">
      <!-- 0: 0° (0, -425) -->
      <g transform="translate(0, -425)">
        <circle cx="0" cy="0" r="34" fill="#FBF9F4" stroke="#1F2937" stroke-width="2.2"/>
        <circle cx="0" cy="0" r="22" fill="#FACC15" fill-opacity="0.3" stroke="#1F2937" stroke-width="1.2"/>
        <circle cx="0" cy="0" r="8" fill="#1F2937"/>
      </g>
      <!-- 1: 22.5° (162.6, -392.6) -->
