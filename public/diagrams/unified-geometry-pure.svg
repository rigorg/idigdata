      <circle cx="0" cy="0" r="66" fill="none" stroke="url(#arc-mdm)" stroke-width="12"/>
      <circle cx="0" cy="0" r="58" fill="#FBF9F4" stroke="#1F2937" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#1F2937" stroke-width="1.2" stroke-dasharray="3,3" stroke-opacity="0.45"/>
      <circle cx="0" cy="0" r="22" fill="#FACC15" fill-opacity="0.35" stroke="#1F2937" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="8" fill="#1F2937"/>
    </g>

    <!-- 6. Central Solid DATA CORE (Clean, Engineering Core — NO Sunburst/Spiritual Rays) -->
    <circle cx="0" cy="0" r="85" fill="#FACC15" stroke="#1F2937" stroke-width="3"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="#1F2937" stroke-width="1.8" stroke-dasharray="4,3" stroke-opacity="0.65"/>
    <circle cx="0" cy="0" r="54" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-opacity="0.55"/>
    <circle cx="0" cy="0" r="34" fill="#FBF9F4" stroke="#1F2937" stroke-width="2"/>
