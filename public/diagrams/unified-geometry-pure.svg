      <circle cx="0" cy="0" r="42" fill="none" stroke="#C2410C" stroke-width="1.5" stroke-dasharray="3,3" stroke-opacity="0.75"/>
      <circle cx="0" cy="0" r="22" fill="#C2410C" fill-opacity="0.3" stroke="#1F2937" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="8" fill="#C2410C"/>
    </g>

    <!-- 6 o'clock (0, 300) : S2S -->
    <g transform="translate(0, 300)">
      <circle cx="0" cy="0" r="66" fill="none" stroke="url(#arc-s2s)" stroke-width="12"/>
      <circle cx="0" cy="0" r="58" fill="#FBF9F4" stroke="#1F2937" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#1F2937" stroke-width="1.2" stroke-dasharray="3,3" stroke-opacity="0.45"/>
