      <circle cx="0" cy="0" r="58" fill="#FBF9F4" stroke="#1F2937" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#1F2937" stroke-width="1.2" stroke-dasharray="3,3" stroke-opacity="0.45"/>
      <circle cx="0" cy="0" r="22" fill="#FACC15" fill-opacity="0.35" stroke="#1F2937" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="8" fill="#1F2937"/>
    </g>

    <!-- 2 o'clock (259.8, -150) : O2C -->
    <g transform="translate(259.8, -150)">
      <circle cx="0" cy="0" r="66" fill="none" stroke="url(#arc-o2c)" stroke-width="12"/>
      <circle cx="0" cy="0" r="58" fill="#FBF9F4" stroke="#1F2937" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#1F2937" stroke-width="1.2" stroke-dasharray="3,3" stroke-opacity="0.45"/>
      <circle cx="0" cy="0" r="22" fill="#FACC15" fill-opacity="0.35" stroke="#1F2937" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="8" fill="#1F2937"/>
