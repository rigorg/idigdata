    <g mask="url(#m-honeycomb-mask)" stroke="#142840" stroke-width="1.8" fill="#FBF9F4">
      <!-- Tier 1: 6 Hexagons tightly wrapping Core -->
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" transform="translate(0, -90)" fill="#FACC15" fill-opacity="0.3"/>
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" transform="translate(78, -45)" fill="#FBF9F4"/>
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" transform="translate(78, 45)" fill="#FACC15" fill-opacity="0.3"/>
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" transform="translate(0, 90)" fill="#FBF9F4"/>
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" transform="translate(-78, 45)" fill="#FACC15" fill-opacity="0.3"/>
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" transform="translate(-78, -45)" fill="#FBF9F4"/>

      <!-- Tier 2: 12 Intermediate Hexagons -->
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" transform="translate(0, -180)" fill="#FDE68A" fill-opacity="0.5"/>
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" transform="translate(78, -135)" fill="#FBF9F4"/>
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" transform="translate(156, -90)" fill="#FDE68A" fill-opacity="0.5"/>
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" transform="translate(156, 0)" fill="#FACC15" fill-opacity="0.35"/>
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" transform="translate(156, 90)" fill="#FDE68A" fill-opacity="0.5"/>
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" transform="translate(78, 135)" fill="#FBF9F4"/>
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" transform="translate(0, 180)" fill="#FDE68A" fill-opacity="0.5"/>
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" transform="translate(-78, 135)" fill="#FBF9F4"/>
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" transform="translate(-156, 90)" fill="#FDE68A" fill-opacity="0.5"/>
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" transform="translate(-156, 0)" fill="#FACC15" fill-opacity="0.35"/>
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" transform="translate(-156, -90)" fill="#FDE68A" fill-opacity="0.5"/>
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" transform="translate(-78, -135)" fill="#FBF9F4"/>
    </g>

