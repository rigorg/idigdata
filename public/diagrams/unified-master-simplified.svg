<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AV-05 · Unified Architecture · Simplified Clean Master">
  <defs>
    <!-- BPSc Weight Arcs -->
    <linearGradient id="m-p2m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142840"/>
      <stop offset="35%" stop-color="#FACC15"/>
      <stop offset="70%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#142840"/>
    </linearGradient>
    <linearGradient id="m-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142840"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#142840"/>
    </linearGradient>

    <!-- Circular Mask to bound Honeycomb cleanly -->
    <mask id="m-honeycomb-mask">
      <rect x="-500" y="-500" width="1000" height="1000" fill="white"/>
      <circle cx="0" cy="0" r="76" fill="black"/>
    </mask>
  </defs>

  <!-- Clean Cream Ground -->
  <rect width="1000" height="1000" fill="#FBF9F4"/>

  <g transform="translate(500, 500)">
    <!-- 1. Pure Concentric Orbital Tracks (Zero Clutter) -->
    <circle cx="0" cy="0" r="435" fill="none" stroke="#142840" stroke-width="2.5" stroke-opacity="0.85"/>
    <circle cx="0" cy="0" r="290" fill="none" stroke="#142840" stroke-width="1.8" stroke-dasharray="6,6" stroke-opacity="0.45"/>
    <circle cx="0" cy="0" r="205" fill="none" stroke="#142840" stroke-width="1.2" stroke-opacity="0.3"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="#142840" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- 2. Direct Radial Spokes from Center Core to ALL 16 Outer System Nodes -->
    <g stroke="#142840" stroke-width="1.8" stroke-opacity="0.65">
      <line x1="0" y1="0" x2="0" y2="-435"/>
      <line x1="0" y1="0" x2="166.5" y2="-401.9"/>
      <line x1="0" y1="0" x2="307.6" y2="-307.6"/>
      <line x1="0" y1="0" x2="401.9" y2="-166.5"/>
      <line x1="0" y1="0" x2="435" y2="0"/>
      <line x1="0" y1="0" x2="401.9" y2="166.5"/>
      <line x1="0" y1="0" x2="307.6" y2="307.6"/>
      <line x1="0" y1="0" x2="166.5" y2="401.9"/>
      <line x1="0" y1="0" x2="0" y2="435"/>
      <line x1="0" y1="0" x2="-166.5" y2="401.9"/>
      <line x1="0" y1="0" x2="-307.6" y2="307.6"/>
      <line x1="0" y1="0" x2="-401.9" y2="166.5"/>
      <line x1="0" y1="0" x2="-435" y2="0"/>
      <line x1="0" y1="0" x2="-401.9" y2="-166.5"/>
      <line x1="0" y1="0" x2="-307.6" y2="-307.6"/>
      <line x1="0" y1="0" x2="-166.5" y2="-401.9"/>
    </g>

    <!-- 3. Heavy Direct Radial Spokes from Center Core to the 6 Process Constellations -->
    <g stroke="#142840" stroke-width="3.8" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-290"/>
      <line x1="0" y1="0" x2="251.1" y2="-145"/>
      <line x1="0" y1="0" x2="251.1" y2="145"/>
      <line x1="0" y1="0" x2="0" y2="290"/>
      <line x1="0" y1="0" x2="-251.1" y2="145"/>
      <line x1="0" y1="0" x2="-251.1" y2="-145"/>
    </g>

