      <circle cx="0" cy="0" r="66" fill="none" stroke="url(#m-gold)" stroke-width="12"/>
      <circle cx="0" cy="0" r="56" fill="#FBF9F4" stroke="#142840" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="36" fill="#FACC15" stroke="#142840" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="12" fill="#142840"/>
    </g>

    <!-- 6. Central Sun-Gold DATA CORE -->
    <circle cx="0" cy="0" r="75" fill="#FACC15" stroke="#142840" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#142840" stroke-width="1.8" stroke-dasharray="4,3"/>
    <circle cx="0" cy="0" r="40" fill="#FBF9F4" stroke="#142840" stroke-width="2"/>
    <circle cx="0" cy="0" r="16" fill="#142840"/>

