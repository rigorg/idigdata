      <g transform="translate(166.5, -401.9)"><circle cx="0" cy="0" r="38" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="24" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="8" fill="#142840"/></g>
      <g transform="translate(307.6, -307.6)"><circle cx="0" cy="0" r="38" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="24" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="8" fill="#142840"/></g>
      <g transform="translate(401.9, -166.5)"><circle cx="0" cy="0" r="38" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="24" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="8" fill="#142840"/></g>
      <g transform="translate(435, 0)"><circle cx="0" cy="0" r="38" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="24" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="8" fill="#142840"/></g>
      <g transform="translate(401.9, 166.5)"><circle cx="0" cy="0" r="38" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="24" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="8" fill="#142840"/></g>
      <g transform="translate(307.6, 307.6)"><circle cx="0" cy="0" r="38" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="24" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="8" fill="#142840"/></g>
      <g transform="translate(166.5, 401.9)"><circle cx="0" cy="0" r="38" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="24" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="8" fill="#142840"/></g>
      <g transform="translate(0, 435)"><circle cx="0" cy="0" r="38" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="24" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="8" fill="#142840"/></g>
      <g transform="translate(-166.5, 401.9)"><circle cx="0" cy="0" r="38" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="24" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="8" fill="#142840"/></g>
      <g transform="translate(-307.6, 307.6)"><circle cx="0" cy="0" r="38" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="24" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="8" fill="#142840"/></g>
      <g transform="translate(-401.9, 166.5)"><circle cx="0" cy="0" r="38" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="24" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="8" fill="#142840"/></g>
      <g transform="translate(-435, 0)"><circle cx="0" cy="0" r="38" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="24" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="8" fill="#142840"/></g>
      <g transform="translate(-401.9, -166.5)"><circle cx="0" cy="0" r="38" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="24" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="8" fill="#142840"/></g>
      <g transform="translate(-307.6, -307.6)"><circle cx="0" cy="0" r="38" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="24" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="8" fill="#142840"/></g>
      <g transform="translate(-166.5, -401.9)"><circle cx="0" cy="0" r="38" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="24" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="8" fill="#142840"/></g>
    </g>
  </g>
</svg>
