      <polygon points="0,-28 24.2,-14 24.2,14 0,28 -24.2,14 -24.2,-14" transform="translate(84, -48.5)" fill="#FBF9F4"/>
      <polygon points="0,-28 24.2,-14 24.2,14 0,28 -24.2,14 -24.2,-14" transform="translate(84, 48.5)" fill="#FACC15" fill-opacity="0.25"/>
