    <circle cx="0" cy="0" r="325" fill="none" stroke="url(#v5-mesh)" stroke-width="220"/>
    <circle cx="0" cy="0" r="435" fill="none" stroke="#142840" stroke-width="2" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="370" fill="none" stroke="#142840" stroke-width="1.2" stroke-dasharray="6,6" stroke-opacity="0.3"/>
