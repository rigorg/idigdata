      <polygon points="0,-28 24.2,-14 24.2,14 0,28 -24.2,14 -24.2,-14" transform="translate(84, 145.5)" fill="#FBF9F4"/>
      <polygon points="0,-28 24.2,-14 24.2,14 0,28 -24.2,14 -24.2,-14" transform="translate(0, 194)" fill="#FDE68A" fill-opacity="0.5"/>
      <polygon points="0,-28 24.2,-14 24.2,14 0,28 -24.2,14 -24.2,-14" transform="translate(-84, 145.5)" fill="#FBF9F4"/>
