      <g transform="translate(401.9, 166.5)"><circle cx="0" cy="0" r="35" fill="#FBF9F4" stroke="#142840" stroke-width="2.4"/><circle cx="0" cy="0" r="22" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="8" fill="#142840"/></g>
      <g transform="translate(307.6, 307.6)"><circle cx="0" cy="0" r="35" fill="#FBF9F4" stroke="#142840" stroke-width="2.4"/><circle cx="0" cy="0" r="22" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="8" fill="#142840"/></g>
