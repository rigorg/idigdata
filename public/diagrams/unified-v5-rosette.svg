<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Version 5: The Radial Rosette Integration">
  <defs>
    <!-- Circular Mask to bound Honeycomb inside concentric tracks -->
    <mask id="v5-honeycomb-mask">
      <rect x="-500" y="-500" width="1000" height="1000" fill="white"/>
      <circle cx="0" cy="0" r="86" fill="black"/>
    </mask>

    <linearGradient id="v5-p2m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142840"/>
      <stop offset="35%" stop-color="#FACC15"/>
      <stop offset="70%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#142840"/>
    </linearGradient>

    <linearGradient id="v5-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142840"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#142840"/>
    </linearGradient>

    <pattern id="v5-mesh" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#FBF9F4"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#142840" stroke-width="0.8" stroke-opacity="0.22"/>
      <line x1="0" y1="0" x2="10" y2="0" stroke="#FACC15" stroke-width="0.8" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1000" height="1000" fill="#FBF9F4"/>

