      <circle cx="0" cy="0" r="54" fill="none" stroke="url(#bh-gold)" stroke-width="10"/>
      <circle cx="0" cy="0" r="44" fill="#FBF9F4" stroke="#142840" stroke-width="3"/>
      <circle cx="0" cy="0" r="26" fill="#FACC15" stroke="#142840" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="8" fill="#142840"/>
    </g>
    <!-- 10h: MDM -->
    <g transform="translate(-233.8, -135)">
      <circle cx="0" cy="0" r="54" fill="none" stroke="url(#bh-gold)" stroke-width="10"/>
      <circle cx="0" cy="0" r="44" fill="#FBF9F4" stroke="#142840" stroke-width="3"/>
      <circle cx="0" cy="0" r="26" fill="#FACC15" stroke="#142840" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="8" fill="#142840"/>
    </g>

    <!-- ========================================== -->
    <!-- 7. THE CENTRAL DATA CORE (MDM + CDM)       -->
    <!-- ========================================== -->
    <circle cx="0" cy="0" r="56" fill="#FACC15" stroke="#142840" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#142840" stroke-width="1.8" stroke-dasharray="3,3"/>
    <circle cx="0" cy="0" r="24" fill="#FBF9F4" stroke="#142840" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#142840"/>

