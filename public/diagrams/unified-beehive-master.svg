      <g transform="translate(164.6, -397.3)"><circle cx="0" cy="0" r="32" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="18" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="6" fill="#142840"/></g>
      <g transform="translate(304.1, -304.1)"><circle cx="0" cy="0" r="32" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="18" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="6" fill="#142840"/></g>
      <g transform="translate(397.3, -164.6)"><circle cx="0" cy="0" r="32" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="18" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="6" fill="#142840"/></g>
      <g transform="translate(430, 0)"><circle cx="0" cy="0" r="32" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="18" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="6" fill="#142840"/></g>
      <g transform="translate(397.3, 164.6)"><circle cx="0" cy="0" r="32" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="18" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="6" fill="#142840"/></g>
      <g transform="translate(304.1, 304.1)"><circle cx="0" cy="0" r="32" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="18" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="6" fill="#142840"/></g>
      <g transform="translate(164.6, 397.3)"><circle cx="0" cy="0" r="32" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="18" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="6" fill="#142840"/></g>
      <g transform="translate(0, 430)"><circle cx="0" cy="0" r="32" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="18" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="6" fill="#142840"/></g>
      <g transform="translate(-164.6, 397.3)"><circle cx="0" cy="0" r="32" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="18" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="6" fill="#142840"/></g>
      <g transform="translate(-304.1, 304.1)"><circle cx="0" cy="0" r="32" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="18" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="6" fill="#142840"/></g>
      <g transform="translate(-397.3, 164.6)"><circle cx="0" cy="0" r="32" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="18" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="6" fill="#142840"/></g>
      <g transform="translate(-430, 0)"><circle cx="0" cy="0" r="32" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="18" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="6" fill="#142840"/></g>
      <g transform="translate(-397.3, -164.6)"><circle cx="0" cy="0" r="32" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="18" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="6" fill="#142840"/></g>
      <g transform="translate(-304.1, -304.1)"><circle cx="0" cy="0" r="32" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="18" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="6" fill="#142840"/></g>
      <g transform="translate(-164.6, -397.3)"><circle cx="0" cy="0" r="32" fill="#FBF9F4" stroke="#142840" stroke-width="2.8"/><circle cx="0" cy="0" r="18" fill="#FACC15" fill-opacity="0.35" stroke="#142840" stroke-width="1.4"/><circle cx="0" cy="0" r="6" fill="#142840"/></g>
    </g>
  </g>
</svg>
