    </pattern>
    <linearGradient id="v1-p2p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.90"/>
      <stop offset="50%" stop-color="#FACC15" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1F2937" stop-opacity="0.90"/>
    </linearGradient>
    <linearGradient id="v1-p2m" x1="0%" y1="0%" x2="100%" y2="100%">
