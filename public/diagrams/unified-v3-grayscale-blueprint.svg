<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Version 3: Precision Grayscale Technical Blueprint">
  <defs>
    <clipPath id="v3-hex-clip">
      <polygon points="0,-270 233.8,-135 233.8,135 0,270 -233.8,135 -233.8,-135"/>
    </clipPath>
    <mask id="v3-core-mask">
      <rect x="-500" y="-500" width="1000" height="1000" fill="white"/>
      <circle cx="0" cy="0" r="54" fill="black"/>
    </mask>

    <pattern id="v3-honeycomb" patternUnits="userSpaceOnUse" width="36" height="62.35">
      <path d="M 0,0 L 18,10.39 L 18,31.18 L 0,41.57 L -18,31.18 L -18,10.39 Z
               M 36,0 L 54,10.39 L 54,31.18 L 36,41.57 L 18,31.18 L 18,10.39 Z
               M 0,62.35 L 18,72.74 L 18,93.53 L 0,103.92 L -18,93.53 L -18,72.74 Z
               M 36,62.35 L 54,72.74 L 54,93.53 L 36,103.92 L 18,93.53 L 18,72.74 Z
               M 18,31.18 L 36,41.57 L 36,62.35 L 18,72.74 L 0,62.35 L 0,41.57 Z"
            fill="none" stroke="#1F2937" stroke-width="1.3" stroke-opacity="0.8"/>
    </pattern>
  </defs>

  <!-- Stark White Ground -->
  <rect width="1000" height="1000" fill="#FFFFFF"/>

  <g transform="translate(500, 500)">
    <!-- 1. Outer Tracks -->
    <circle cx="0" cy="0" r="445" fill="none" stroke="#1F2937" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="415" fill="none" stroke="#1F2937" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="335" fill="none" stroke="#1F2937" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="270" fill="none" stroke="#1F2937" stroke-width="1.8"/>

    <!-- 2. 16 Thin Radial Spokes (1.2px) -->
    <g stroke="#1F2937" stroke-width="1.3" stroke-opacity="0.6">
      <line x1="0" y1="0" x2="0" y2="-445"/>
      <line x1="0" y1="0" x2="170.3" y2="-411.1"/>
      <line x1="0" y1="0" x2="314.7" y2="-314.7"/>
      <line x1="0" y1="0" x2="411.1" y2="-170.3"/>
      <line x1="0" y1="0" x2="445" y2="0"/>
      <line x1="0" y1="0" x2="411.1" y2="170.3"/>
      <line x1="0" y1="0" x2="314.7" y2="314.7"/>
      <line x1="0" y1="0" x2="170.3" y2="411.1"/>
      <line x1="0" y1="0" x2="0" y2="445"/>
      <line x1="0" y1="0" x2="-170.3" y2="411.1"/>
      <line x1="0" y1="0" x2="-314.7" y2="314.7"/>
      <line x1="0" y1="0" x2="-411.1" y2="170.3"/>
      <line x1="0" y1="0" x2="-445" y2="0"/>
      <line x1="0" y1="0" x2="-411.1" y2="-170.3"/>
      <line x1="0" y1="0" x2="-314.7" y2="-314.7"/>
      <line x1="0" y1="0" x2="-170.3" y2="-411.1"/>
    </g>

    <!-- 3. Complete Seamless Honeycomb Infill -->
    <rect x="-300" y="-300" width="600" height="600"
          fill="url(#v3-honeycomb)"
          clip-path="url(#v3-hex-clip)"
          mask="url(#v3-core-mask)"/>

    <!-- 4. Major Constellation Hexagon Perimeter & 6 Core Spokes -->
    <polygon points="0,-270 233.8,-135 233.8,135 0,270 -233.8,135 -233.8,-135" fill="none" stroke="#1F2937" stroke-width="5"/>
    <polygon points="0,-280 242.5,-140 242.5,140 0,280 -242.5,140 -242.5,-140" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-opacity="0.7"/>

    <g stroke="#1F2937" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-270"/>
      <line x1="0" y1="0" x2="233.8" y2="-135"/>
      <line x1="0" y1="0" x2="233.8" y2="135"/>
      <line x1="0" y1="0" x2="0" y2="270"/>
      <line x1="0" y1="0" x2="-233.8" y2="135"/>
      <line x1="0" y1="0" x2="-233.8" y2="-135"/>
    </g>

    <!-- 5. Six Large Constellation Hubs (r=50) -->
    <g transform="translate(0, -270)"><circle cx="0" cy="0" r="50" fill="#FFFFFF" stroke="#1F2937" stroke-width="4"/><circle cx="0" cy="0" r="38" fill="none" stroke="#1F2937" stroke-width="1.8"/><circle cx="0" cy="0" r="14" fill="#1F2937"/></g>
    <g transform="translate(233.8, -135)"><circle cx="0" cy="0" r="50" fill="#FFFFFF" stroke="#1F2937" stroke-width="4"/><circle cx="0" cy="0" r="38" fill="none" stroke="#1F2937" stroke-width="1.8"/><circle cx="0" cy="0" r="14" fill="#1F2937"/></g>
    <g transform="translate(233.8, 135)"><circle cx="0" cy="0" r="50" fill="#FFFFFF" stroke="#1F2937" stroke-width="4.5"/><circle cx="0" cy="0" r="38" fill="#1F2937" stroke="#1F2937" stroke-width="2"/><circle cx="0" cy="0" r="14" fill="#FFFFFF"/></g>
    <g transform="translate(0, 270)"><circle cx="0" cy="0" r="50" fill="#FFFFFF" stroke="#1F2937" stroke-width="4"/><circle cx="0" cy="0" r="38" fill="none" stroke="#1F2937" stroke-width="1.8"/><circle cx="0" cy="0" r="14" fill="#1F2937"/></g>
    <g transform="translate(-233.8, 135)"><circle cx="0" cy="0" r="50" fill="#FFFFFF" stroke="#1F2937" stroke-width="4"/><circle cx="0" cy="0" r="38" fill="none" stroke="#1F2937" stroke-width="1.8"/><circle cx="0" cy="0" r="14" fill="#1F2937"/></g>
    <g transform="translate(-233.8, -135)"><circle cx="0" cy="0" r="50" fill="#FFFFFF" stroke="#1F2937" stroke-width="4"/><circle cx="0" cy="0" r="38" fill="none" stroke="#1F2937" stroke-width="1.8"/><circle cx="0" cy="0" r="14" fill="#1F2937"/></g>

    <!-- 6. Central Data Core -->
    <circle cx="0" cy="0" r="54" fill="#1F2937" stroke="#1F2937" stroke-width="4"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3,3"/>
    <circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#1F2937"/>

    <!-- 7. 16 System Bubbles (r=26) -->
    <g>
      <g transform="translate(0, -415)"><circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="none" stroke="#1F2937" stroke-width="1.2"/></g>
      <g transform="translate(158.8, -383.4)"><circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="none" stroke="#1F2937" stroke-width="1.2"/></g>
      <g transform="translate(293.4, -293.4)"><circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="none" stroke="#1F2937" stroke-width="1.2"/></g>
      <g transform="translate(383.4, -158.8)"><circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="none" stroke="#1F2937" stroke-width="1.2"/></g>
      <g transform="translate(415, 0)"><circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="none" stroke="#1F2937" stroke-width="1.2"/></g>
      <g transform="translate(383.4, 158.8)"><circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="none" stroke="#1F2937" stroke-width="1.2"/></g>
      <g transform="translate(293.4, 293.4)"><circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="none" stroke="#1F2937" stroke-width="1.2"/></g>
      <g transform="translate(158.8, 383.4)"><circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="none" stroke="#1F2937" stroke-width="1.2"/></g>
      <g transform="translate(0, 415)"><circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="none" stroke="#1F2937" stroke-width="1.2"/></g>
      <g transform="translate(-158.8, 383.4)"><circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="none" stroke="#1F2937" stroke-width="1.2"/></g>
      <g transform="translate(-293.4, 293.4)"><circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="none" stroke="#1F2937" stroke-width="1.2"/></g>
      <g transform="translate(-383.4, 158.8)"><circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="none" stroke="#1F2937" stroke-width="1.2"/></g>
      <g transform="translate(-415, 0)"><circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="none" stroke="#1F2937" stroke-width="1.2"/></g>
      <g transform="translate(-383.4, -158.8)"><circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="none" stroke="#1F2937" stroke-width="1.2"/></g>
      <g transform="translate(-293.4, -293.4)"><circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="none" stroke="#1F2937" stroke-width="1.2"/></g>
      <g transform="translate(-158.8, -383.4)"><circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.8"/><circle cx="0" cy="0" r="14" fill="none" stroke="#1F2937" stroke-width="1.2"/></g>
    </g>
  </g>
</svg>
