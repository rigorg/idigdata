<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Metatron Systemic Master · Dark Edition">
  <defs>
    <linearGradient id="dark-orange-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
  </defs>

  <!-- Deep Dark Slate Ground (Honoring the physical mat) -->
  <rect width="1000" height="1000" fill="#141923"/>

  <g transform="translate(500, 500)">
    <!-- 1. Outer Orbital Guide Circles -->
    <circle cx="0" cy="0" r="430" fill="none" stroke="#FF6B00" stroke-width="3"/>
    <circle cx="0" cy="0" r="390" fill="none" stroke="#FF6B00" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="270" fill="none" stroke="#FACC15" stroke-width="1.8" stroke-dasharray="8,6" stroke-opacity="0.5"/>

    <!-- 2. The 16 Direct Radial Spokes -->
    <g stroke="#FF6B00" stroke-width="1.5" stroke-opacity="0.5">
      <line x1="0" y1="0" x2="0" y2="-430"/>
      <line x1="0" y1="0" x2="164.6" y2="-397.3"/>
      <line x1="0" y1="0" x2="304.1" y2="-304.1"/>
      <line x1="0" y1="0" x2="397.3" y2="-164.6"/>
      <line x1="0" y1="0" x2="430" y2="0"/>
      <line x1="0" y1="0" x2="397.3" y2="164.6"/>
      <line x1="0" y1="0" x2="304.1" y2="304.1"/>
      <line x1="0" y1="0" x2="164.6" y2="397.3"/>
      <line x1="0" y1="0" x2="0" y2="430"/>
      <line x1="0" y1="0" x2="-164.6" y2="397.3"/>
      <line x1="0" y1="0" x2="-304.1" y2="304.1"/>
      <line x1="0" y1="0" x2="-397.3" y2="164.6"/>
      <line x1="0" y1="0" x2="-430" y2="0"/>
      <line x1="0" y1="0" x2="-397.3" y2="-164.6"/>
      <line x1="0" y1="0" x2="-304.1" y2="-304.1"/>
      <line x1="0" y1="0" x2="-164.6" y2="-397.3"/>
    </g>

    <!-- 3. Dimension 1: The Beehive (3D Isometric Honeycomb Frames) -->
    <polygon points="0,-150 129.9,-75 129.9,75 0,150 -129.9,75 -129.9,-75" fill="none" stroke="#FACC15" stroke-width="2.5"/>
    <polygon points="0,-210 181.9,-105 181.9,105 0,210 -181.9,105 -181.9,-105" fill="none" stroke="#FF6B00" stroke-width="1.8" stroke-dasharray="6,6" stroke-opacity="0.6"/>

    <!-- 4. Dimension 2: The Metatron Sacred Geometry Framework (Star Tetrahedron / Hexagram Beams) -->
    <!-- Major Hexagon Perimeter -->
    <polygon points="0,-270 233.8,-135 233.8,135 0,270 -233.8,135 -233.8,-135" fill="#FF6B00" fill-opacity="0.08" stroke="#FF6B00" stroke-width="4"/>

    <!-- Upward & Downward Triangles -->
    <polygon points="0,-270 233.8,135 -233.8,135" fill="none" stroke="#FACC15" stroke-width="3"/>
    <polygon points="0,270 233.8,-135 -233.8,-135" fill="none" stroke="#FACC15" stroke-width="3"/>

    <!-- Internal Metatron 3D Isometric Cube Diagonals -->
    <g stroke="#FF6B00" stroke-width="3.5">
      <line x1="0" y1="-270" x2="0" y2="270"/>
      <line x1="-233.8" y1="-135" x2="233.8" y2="135"/>
      <line x1="-233.8" y1="135" x2="233.8" y2="-135"/>
    </g>

    <!-- Inner 3D Star Diamond Chords -->
    <g stroke="#FACC15" stroke-width="2" stroke-opacity="0.8">
      <line x1="0" y1="-150" x2="129.9,75"/><line x1="129.9,75" x2="-129.9,75"/><line x1="-129.9,75" x2="0" y2="-150"/>
      <line x1="0" y1="150" x2="129.9,-75"/><line x1="129.9,-75" x2="-129.9,-75"/><line x1="-129.9,-75" x2="0" y2="150"/>
    </g>

    <!-- 5. Dimension 2: The Six Process Constellations -->
    <!-- 12h: P2P -->
    <g transform="translate(0, -270)">
      <circle cx="0" cy="0" r="58" fill="none" stroke="url(#dark-orange-gold)" stroke-width="10"/>
      <circle cx="0" cy="0" r="48" fill="#141923" stroke="#FF6B00" stroke-width="3"/>
      <circle cx="0" cy="0" r="30" fill="#FF6B00" stroke="#FACC15" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="#FACC15"/>
    </g>
    <!-- 2h: O2C -->
    <g transform="translate(233.8, -135)">
      <circle cx="0" cy="0" r="58" fill="none" stroke="url(#dark-orange-gold)" stroke-width="10"/>
      <circle cx="0" cy="0" r="48" fill="#141923" stroke="#FF6B00" stroke-width="3"/>
      <circle cx="0" cy="0" r="30" fill="#FF6B00" stroke="#FACC15" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="#FACC15"/>
    </g>
    <!-- 4h: P2M -->
    <g transform="translate(233.8, 135)">
      <circle cx="0" cy="0" r="58" fill="none" stroke="#FF6B00" stroke-width="12"/>
      <circle cx="0" cy="0" r="48" fill="#141923" stroke="#FACC15" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="30" fill="#FACC15" stroke="#FF6B00" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="#FF6B00"/>
    </g>
    <!-- 6h: S2S -->
    <g transform="translate(0, 270)">
      <circle cx="0" cy="0" r="58" fill="none" stroke="url(#dark-orange-gold)" stroke-width="10"/>
      <circle cx="0" cy="0" r="48" fill="#141923" stroke="#FF6B00" stroke-width="3"/>
      <circle cx="0" cy="0" r="30" fill="#FF6B00" stroke="#FACC15" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="#FACC15"/>
    </g>
    <!-- 8h: D2R -->
    <g transform="translate(-233.8, 135)">
      <circle cx="0" cy="0" r="58" fill="none" stroke="url(#dark-orange-gold)" stroke-width="10"/>
      <circle cx="0" cy="0" r="48" fill="#141923" stroke="#FF6B00" stroke-width="3"/>
      <circle cx="0" cy="0" r="30" fill="#FF6B00" stroke="#FACC15" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="#FACC15"/>
    </g>
    <!-- 10h: MDM -->
    <g transform="translate(-233.8, -135)">
      <circle cx="0" cy="0" r="58" fill="none" stroke="url(#dark-orange-gold)" stroke-width="10"/>
      <circle cx="0" cy="0" r="48" fill="#141923" stroke="#FF6B00" stroke-width="3"/>
      <circle cx="0" cy="0" r="30" fill="#FF6B00" stroke="#FACC15" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="#FACC15"/>
    </g>

    <!-- 6. Central Solid DATA CORE with 3D Isometric Cube -->
    <circle cx="0" cy="0" r="75" fill="#FF6B00" stroke="#FACC15" stroke-width="4"/>
    <polygon points="0,-48 41.6,-24 41.6,24 0,48 -41.6,24 -41.6,-24" fill="#141923" fill-opacity="0.3" stroke="#FACC15" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="0" y2="-48" stroke="#FACC15" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="41.6" y2="24" stroke="#FACC15" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="-41.6" y2="24" stroke="#FACC15" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="14" fill="#FACC15"/>

    <!-- 7. Dimension 3: The Systemverse (16 Equally-Sized Bubbles at R=430) -->
    <g id="metatron-system-bubbles-dark">
      <g transform="translate(0, -430)"><circle cx="0" cy="0" r="34" fill="#141923" stroke="#FF6B00" stroke-width="3"/><circle cx="0" cy="0" r="20" fill="#FF6B00" fill-opacity="0.35" stroke="#FACC15" stroke-width="1.5"/><circle cx="0" cy="0" r="7" fill="#FACC15"/></g>
      <g transform="translate(164.6, -397.3)"><circle cx="0" cy="0" r="34" fill="#141923" stroke="#FF6B00" stroke-width="3"/><circle cx="0" cy="0" r="20" fill="#FF6B00" fill-opacity="0.35" stroke="#FACC15" stroke-width="1.5"/><circle cx="0" cy="0" r="7" fill="#FACC15"/></g>
      <g transform="translate(304.1, -304.1)"><circle cx="0" cy="0" r="34" fill="#141923" stroke="#FF6B00" stroke-width="3"/><circle cx="0" cy="0" r="20" fill="#FF6B00" fill-opacity="0.35" stroke="#FACC15" stroke-width="1.5"/><circle cx="0" cy="0" r="7" fill="#FACC15"/></g>
      <g transform="translate(397.3, -164.6)"><circle cx="0" cy="0" r="34" fill="#141923" stroke="#FF6B00" stroke-width="3"/><circle cx="0" cy="0" r="20" fill="#FF6B00" fill-opacity="0.35" stroke="#FACC15" stroke-width="1.5"/><circle cx="0" cy="0" r="7" fill="#FACC15"/></g>
      <g transform="translate(430, 0)"><circle cx="0" cy="0" r="34" fill="#141923" stroke="#FF6B00" stroke-width="3"/><circle cx="0" cy="0" r="20" fill="#FF6B00" fill-opacity="0.35" stroke="#FACC15" stroke-width="1.5"/><circle cx="0" cy="0" r="7" fill="#FACC15"/></g>
      <g transform="translate(397.3, 164.6)"><circle cx="0" cy="0" r="34" fill="#141923" stroke="#FF6B00" stroke-width="3"/><circle cx="0" cy="0" r="20" fill="#FF6B00" fill-opacity="0.35" stroke="#FACC15" stroke-width="1.5"/><circle cx="0" cy="0" r="7" fill="#FACC15"/></g>
      <g transform="translate(304.1, 304.1)"><circle cx="0" cy="0" r="34" fill="#141923" stroke="#FF6B00" stroke-width="3"/><circle cx="0" cy="0" r="20" fill="#FF6B00" fill-opacity="0.35" stroke="#FACC15" stroke-width="1.5"/><circle cx="0" cy="0" r="7" fill="#FACC15"/></g>
      <g transform="translate(164.6, 397.3)"><circle cx="0" cy="0" r="34" fill="#141923" stroke="#FF6B00" stroke-width="3"/><circle cx="0" cy="0" r="20" fill="#FF6B00" fill-opacity="0.35" stroke="#FACC15" stroke-width="1.5"/><circle cx="0" cy="0" r="7" fill="#FACC15"/></g>
      <g transform="translate(0, 430)"><circle cx="0" cy="0" r="34" fill="#141923" stroke="#FF6B00" stroke-width="3"/><circle cx="0" cy="0" r="20" fill="#FF6B00" fill-opacity="0.35" stroke="#FACC15" stroke-width="1.5"/><circle cx="0" cy="0" r="7" fill="#FACC15"/></g>
      <g transform="translate(-164.6, 397.3)"><circle cx="0" cy="0" r="34" fill="#141923" stroke="#FF6B00" stroke-width="3"/><circle cx="0" cy="0" r="20" fill="#FF6B00" fill-opacity="0.35" stroke="#FACC15" stroke-width="1.5"/><circle cx="0" cy="0" r="7" fill="#FACC15"/></g>
      <g transform="translate(-304.1, 304.1)"><circle cx="0" cy="0" r="34" fill="#141923" stroke="#FF6B00" stroke-width="3"/><circle cx="0" cy="0" r="20" fill="#FF6B00" fill-opacity="0.35" stroke="#FACC15" stroke-width="1.5"/><circle cx="0" cy="0" r="7" fill="#FACC15"/></g>
      <g transform="translate(-397.3, 164.6)"><circle cx="0" cy="0" r="34" fill="#141923" stroke="#FF6B00" stroke-width="3"/><circle cx="0" cy="0" r="20" fill="#FF6B00" fill-opacity="0.35" stroke="#FACC15" stroke-width="1.5"/><circle cx="0" cy="0" r="7" fill="#FACC15"/></g>
      <g transform="translate(-430, 0)"><circle cx="0" cy="0" r="34" fill="#141923" stroke="#FF6B00" stroke-width="3"/><circle cx="0" cy="0" r="20" fill="#FF6B00" fill-opacity="0.35" stroke="#FACC15" stroke-width="1.5"/><circle cx="0" cy="0" r="7" fill="#FACC15"/></g>
      <g transform="translate(-397.3, -164.6)"><circle cx="0" cy="0" r="34" fill="#141923" stroke="#FF6B00" stroke-width="3"/><circle cx="0" cy="0" r="20" fill="#FF6B00" fill-opacity="0.35" stroke="#FACC15" stroke-width="1.5"/><circle cx="0" cy="0" r="7" fill="#FACC15"/></g>
      <g transform="translate(-304.1, -304.1)"><circle cx="0" cy="0" r="34" fill="#141923" stroke="#FF6B00" stroke-width="3"/><circle cx="0" cy="0" r="20" fill="#FF6B00" fill-opacity="0.35" stroke="#FACC15" stroke-width="1.5"/><circle cx="0" cy="0" r="7" fill="#FACC15"/></g>
      <g transform="translate(-164.6, -397.3)"><circle cx="0" cy="0" r="34" fill="#141923" stroke="#FF6B00" stroke-width="3"/><circle cx="0" cy="0" r="20" fill="#FF6B00" fill-opacity="0.35" stroke="#FACC15" stroke-width="1.5"/><circle cx="0" cy="0" r="7" fill="#FACC15"/></g>
    </g>
  </g>
</svg>
