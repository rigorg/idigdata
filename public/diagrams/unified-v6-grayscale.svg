    <pattern id="v6-hatch-light" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1F2937" stroke-width="0.8"/>
