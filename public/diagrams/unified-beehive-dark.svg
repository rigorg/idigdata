      <g transform="translate(-164.6, 397.3)"><circle cx="0" cy="0" r="32" fill="#141923" stroke="#FF6B00" stroke-width="2.8"/><circle cx="0" cy="0" r="18" fill="#FF6B00" fill-opacity="0.35" stroke="#FACC15" stroke-width="1.4"/><circle cx="0" cy="0" r="6" fill="#FACC15"/></g>
      <g transform="translate(-304.1, 304.1)"><circle cx="0" cy="0" r="32" fill="#141923" stroke="#FF6B00" stroke-width="2.8"/><circle cx="0" cy="0" r="18" fill="#FF6B00" fill-opacity="0.35" stroke="#FACC15" stroke-width="1.4"/><circle cx="0" cy="0" r="6" fill="#FACC15"/></g>
      <g transform="translate(-397.3, 164.6)"><circle cx="0" cy="0" r="32" fill="#141923" stroke="#FF6B00" stroke-width="2.8"/><circle cx="0" cy="0" r="18" fill="#FF6B00" fill-opacity="0.35" stroke="#FACC15" stroke-width="1.4"/><circle cx="0" cy="0" r="6" fill="#FACC15"/></g>
