      <line x1="0" y1="-440" x2="311.1" y2="311.1"/><line x1="0" y1="-440" x2="-311.1" y2="311.1"/>
      <line x1="440" y1="0" x2="-311.1" y2="311.1"/><line x1="440" y1="0" x2="-311.1" y2="-311.1"/>
      <line x1="0" y1="440" x2="311.1" y2="-311.1"/><line x1="0" y1="440" x2="-311.1" y2="-311.1"/>
      <line x1="-440" y1="0" x2="311.1" y2="311.1"/><line x1="-440" y1="0" x2="311.1" y2="-311.1"/>
      <!-- Internal Sacred Hexagon Ring Chords -->
      <polygon points="0,-290 251.1,-145 251.1,145 0,290 -251.1,145 -251.1,-145" fill="none" stroke="#FACC15" stroke-width="1.4" opacity="0.6"/>
      <polygon points="0,-290 251.1,145 -251.1,145" fill="none" stroke="#1F2937" stroke-width="1.2" opacity="0.35"/>
      <polygon points="0,290 251.1,-145 -251.1,-145" fill="none" stroke="#1F2937" stroke-width="1.2" opacity="0.35"/>
    </g>

    <!-- Honeycomb Matrix -->
