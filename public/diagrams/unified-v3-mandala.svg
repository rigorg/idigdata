      <g transform="translate(311.1, -311.1)"><circle cx="0" cy="0" r="35" fill="#FBF9F4" stroke="#1F2937" stroke-width="2.2"/><circle cx="0" cy="0" r="22" fill="#FACC15" fill-opacity="0.35" stroke="#1F2937" stroke-width="1.2"/><circle cx="0" cy="0" r="8" fill="#1F2937"/></g>
