    <circle cx="0" cy="0" r="330" fill="none" stroke="url(#v3-sub)" stroke-width="240"/>
    <circle cx="0" cy="0" r="440" fill="none" stroke="#1F2937" stroke-width="1.6" opacity="0.4"/>
    <circle cx="0" cy="0" r="380" fill="none" stroke="#1F2937" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>
    <circle cx="0" cy="0" r="290" fill="none" stroke="#1F2937" stroke-width="1.4" opacity="0.35"/>
    <circle cx="0" cy="0" r="190" fill="none" stroke="#1F2937" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.35"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#1F2937" stroke-width="1.6" opacity="0.45"/>

