      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" transform="translate(90, -156)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" transform="translate(135, -78)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" transform="translate(180, 0)" fill="#FDE68A" fill-opacity="0.45"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" transform="translate(135, 78)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" transform="translate(90, 156)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" transform="translate(0, 156)" fill="#FDE68A" fill-opacity="0.45"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" transform="translate(-90, 156)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" transform="translate(-135, 78)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" transform="translate(-180, 0)" fill="#FDE68A" fill-opacity="0.45"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" transform="translate(-135, -78)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" transform="translate(-90, -156)"/>
