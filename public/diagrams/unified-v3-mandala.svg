      <circle cx="0" cy="0" r="56" fill="#FBF9F4" stroke="#1F2937" stroke-width="2.2"/>
      <circle cx="0" cy="0" r="38" fill="none" stroke="#FACC15" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="18" fill="#1F2937"/>
