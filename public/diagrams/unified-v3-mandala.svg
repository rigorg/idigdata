      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" transform="translate(90, 0)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" transform="translate(45, 78)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" transform="translate(-45, 78)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" transform="translate(-90, 0)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" transform="translate(-45, -78)"/>
      <!-- Outer Hexagon Matrix -->
