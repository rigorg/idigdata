      <g transform="translate(406.5, 168.4)"><circle cx="0" cy="0" r="35" fill="#FBF9F4" stroke="#1F2937" stroke-width="2.2"/><circle cx="0" cy="0" r="22" fill="#FACC15" fill-opacity="0.35" stroke="#1F2937" stroke-width="1.2"/><circle cx="0" cy="0" r="8" fill="#1F2937"/></g>
      <g transform="translate(311.1, 311.1)"><circle cx="0" cy="0" r="35" fill="#FBF9F4" stroke="#1F2937" stroke-width="2.2"/><circle cx="0" cy="0" r="22" fill="#FACC15" fill-opacity="0.35" stroke="#1F2937" stroke-width="1.2"/><circle cx="0" cy="0" r="8" fill="#1F2937"/></g>
      <g transform="translate(168.4, 406.5)"><circle cx="0" cy="0" r="35" fill="#FBF9F4" stroke="#1F2937" stroke-width="2.2"/><circle cx="0" cy="0" r="22" fill="#FACC15" fill-opacity="0.35" stroke="#1F2937" stroke-width="1.2"/><circle cx="0" cy="0" r="8" fill="#1F2937"/></g>
      <g transform="translate(0, 440)"><circle cx="0" cy="0" r="35" fill="#FBF9F4" stroke="#1F2937" stroke-width="2.2"/><circle cx="0" cy="0" r="22" fill="#FACC15" fill-opacity="0.35" stroke="#1F2937" stroke-width="1.2"/><circle cx="0" cy="0" r="8" fill="#1F2937"/></g>
      <g transform="translate(-168.4, 406.5)"><circle cx="0" cy="0" r="35" fill="#FBF9F4" stroke="#1F2937" stroke-width="2.2"/><circle cx="0" cy="0" r="22" fill="#FACC15" fill-opacity="0.35" stroke="#1F2937" stroke-width="1.2"/><circle cx="0" cy="0" r="8" fill="#1F2937"/></g>
      <g transform="translate(-311.1, 311.1)"><circle cx="0" cy="0" r="35" fill="#FBF9F4" stroke="#1F2937" stroke-width="2.2"/><circle cx="0" cy="0" r="22" fill="#FACC15" fill-opacity="0.35" stroke="#1F2937" stroke-width="1.2"/><circle cx="0" cy="0" r="8" fill="#1F2937"/></g>
      <g transform="translate(-406.5, 168.4)"><circle cx="0" cy="0" r="35" fill="#FBF9F4" stroke="#1F2937" stroke-width="2.2"/><circle cx="0" cy="0" r="22" fill="#FACC15" fill-opacity="0.35" stroke="#1F2937" stroke-width="1.2"/><circle cx="0" cy="0" r="8" fill="#1F2937"/></g>
      <g transform="translate(-440, 0)"><circle cx="0" cy="0" r="35" fill="#FBF9F4" stroke="#1F2937" stroke-width="2.2"/><circle cx="0" cy="0" r="22" fill="#FACC15" fill-opacity="0.35" stroke="#1F2937" stroke-width="1.2"/><circle cx="0" cy="0" r="8" fill="#1F2937"/></g>
      <g transform="translate(-406.5, -168.4)"><circle cx="0" cy="0" r="35" fill="#FBF9F4" stroke="#1F2937" stroke-width="2.2"/><circle cx="0" cy="0" r="22" fill="#FACC15" fill-opacity="0.35" stroke="#1F2937" stroke-width="1.2"/><circle cx="0" cy="0" r="8" fill="#1F2937"/></g>
      <g transform="translate(-311.1, -311.1)"><circle cx="0" cy="0" r="35" fill="#FBF9F4" stroke="#1F2937" stroke-width="2.2"/><circle cx="0" cy="0" r="22" fill="#FACC15" fill-opacity="0.35" stroke="#1F2937" stroke-width="1.2"/><circle cx="0" cy="0" r="8" fill="#1F2937"/></g>
      <g transform="translate(-168.4, -406.5)"><circle cx="0" cy="0" r="35" fill="#FBF9F4" stroke="#1F2937" stroke-width="2.2"/><circle cx="0" cy="0" r="22" fill="#FACC15" fill-opacity="0.35" stroke="#1F2937" stroke-width="1.2"/><circle cx="0" cy="0" r="8" fill="#1F2937"/></g>
