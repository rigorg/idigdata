<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Version 3: The Celestial Operating Mandala">
  <defs>
    <pattern id="v3-sub" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#FBF9F4"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1F2937" stroke-width="0.6" stroke-opacity="0.18"/>
      <line x1="0" y1="0" x2="8" y2="0" stroke="#FACC15" stroke-width="0.6" stroke-opacity="0.38"/>
    </pattern>
    <linearGradient id="v3-p2m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FACC15" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#C2410C" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1F2937" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="v3-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FACC15" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#1F2937" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1000" fill="#FBF9F4"/>

  <g transform="translate(500, 500)">
