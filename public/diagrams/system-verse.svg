<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="138 12 524 606" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sv-title sv-desc">
  <title id="sv-title">AV-03 · The Systemverse · brand-v2 · author-v2.3 · 2026-10-08</title>
  <desc id="sv-desc">A celestial composition. Data core at the gravitational center; 16 functional system groups form a tightly-packed ring at the application orbit. Sixteen thin connectivity spokes radiate from each system group to the data core. An integration fabric annulus overlays the spokes. Brand v2: charcoal structure, sun-gold data core, cream substrate.</desc>

  <defs>
    <!-- Integration fabric – cross-hatch pattern weaving charcoal + sun-gold. -->
    <pattern id="integration-fabric" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#FBF9F4"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1F2937" stroke-width="0.7" stroke-opacity="0.45"/>
      <line x1="0" y1="0" x2="8" y2="0" stroke="#FACC15" stroke-width="0.6" stroke-opacity="0.70"/>
    </pattern>
  </defs>

  <!-- Background – cream substrate -->
  <rect width="800" height="900" fill="#FBF9F4"/>

  <!-- Title block -->
  <text x="400" y="50" text-anchor="middle" font-weight="900" font-size="28" fill="#1F2937" letter-spacing="-0.3" font-family="'Helvetica Neue', 'Arial Black', Impact, system-ui, sans-serif">THE SYSTEMVERSE</text>
  <text x="400" y="74" text-anchor="middle" font-style="italic" font-size="13" fill="#6B6860" font-family="Georgia, 'Times New Roman', serif">Future-state systems map · what runs the process flows and data core</text>

  <g transform="translate(0,-110)">
  <!-- Application Layer label -->
  <text x="400" y="196" text-anchor="middle" font-style="italic" font-weight="600" font-size="12" fill="#6B6860" letter-spacing="3" font-family="Georgia, 'Times New Roman', serif">APPLICATION LAYER</text>

  <!-- Integration fabric annulus -->
  <circle cx="400" cy="470" r="130" fill="none" stroke="url(#integration-fabric)" stroke-width="70"/>
  <circle cx="400" cy="470" r="165" fill="none" stroke="#1F2937" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="400" cy="470" r="95" fill="none" stroke="#1F2937" stroke-width="1.2" stroke-opacity="0.45"/>

  <!-- Connectivity spokes – 16 thin charcoal lines -->
  <g stroke="#1F2937" stroke-width="1.2" stroke-opacity="0.55" fill="none">
    <line x1="400" y1="265" x2="400" y2="470"/>
    <line x1="478.5" y1="280.5" x2="400" y2="470"/>
    <line x1="545" y1="325" x2="400" y2="470"/>
    <line x1="589.5" y1="391.5" x2="400" y2="470"/>
    <line x1="605" y1="470" x2="400" y2="470"/>
    <line x1="589.5" y1="548.5" x2="400" y2="470"/>
    <line x1="545" y1="615" x2="400" y2="470"/>
    <line x1="478.5" y1="659.5" x2="400" y2="470"/>
    <line x1="400" y1="675" x2="400" y2="470"/>
    <line x1="321.5" y1="659.5" x2="400" y2="470"/>
    <line x1="255" y1="615" x2="400" y2="470"/>
    <line x1="210.5" y1="548.5" x2="400" y2="470"/>
    <line x1="195" y1="470" x2="400" y2="470"/>
    <line x1="210.5" y1="391.5" x2="400" y2="470"/>
    <line x1="255" y1="325" x2="400" y2="470"/>
    <line x1="321.5" y1="280.5" x2="400" y2="470"/>
  </g>

  <!-- Integration backbone label -->
  <text x="400" y="344" text-anchor="middle" font-style="italic" font-weight="600" font-size="11" fill="#6B6860" letter-spacing="2.2" font-family="Georgia, 'Times New Roman', serif">INTEGRATION BACKBONE</text>

  <!-- Data Core -->
  <circle cx="400" cy="470" r="95" fill="#FACC15" stroke="#1F2937" stroke-width="2.5"/>
  <text x="400" y="442" text-anchor="middle" font-weight="900" font-size="22" fill="#1F2937" letter-spacing="3" font-family="'Helvetica Neue', 'Arial Black', Impact, system-ui, sans-serif">DATA CORE</text>
  <line x1="360" y1="454" x2="440" y2="454" stroke="#1F2937" stroke-width="1.5" opacity="0.6"/>
  <text x="400" y="473" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">Common Data Model</text>
  <text x="400" y="492" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F2937" opacity="0.9" font-family="system-ui, -apple-system, sans-serif">Integrations · Ingestion</text>
  <text x="400" y="509" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F2937" opacity="0.9" font-family="system-ui, -apple-system, sans-serif">Transformations · DW</text>

